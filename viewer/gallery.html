<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Models</title>
<meta name="description" content="이 저장소에 올라와 있는 3D 모델 목록. 각 항목을 누르면 뷰어가 열리고 모바일에서는 AR 로 볼 수 있다.">
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --ink:#16181d; --muted:#5b6270;
    --line:#dfe3e9; --accent:#2f6df6; --radius:12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1115; --panel:#171a20; --ink:#e8eaee; --muted:#9aa2b1;
      --line:#272b33; --accent:#5b8cff;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f1115; --panel:#171a20; --ink:#e8eaee; --muted:#9aa2b1;
    --line:#272b33; --accent:#5b8cff;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI",
         "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  .wrap { max-width:720px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:20px; margin:0 0 4px; font-weight:650; letter-spacing:-0.01em; }
  .lead { color:var(--muted); font-size:14px; margin:0 0 24px; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  a.card {
    display:block; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px;
    text-decoration:none; color:inherit;
  }
  a.card:hover { border-color:var(--accent); }
  a.card .t { font-weight:600; }
  a.card .n { color:var(--muted); font-size:13px; margin-top:2px; }
  a.card .p { color:var(--muted); font-size:12px; margin-top:6px;
              font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .msg { color:var(--muted); font-size:14px; }
  .msg code {
    background:var(--panel); border:1px solid var(--line);
    border-radius:6px; padding:2px 6px; font-size:13px;
  }
  footer { margin-top:28px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>3D Models</h1>
  <p class="lead">항목을 누르면 뷰어가 열립니다. 휴대폰에서는 AR 로 볼 수 있습니다.</p>
  <ul id="list"></ul>
  <div class="msg" id="msg" hidden></div>
  <footer id="foot" hidden></footer>
</div>

<script type="module">
  const list = document.getElementById('list');
  const msg = document.getElementById('msg');

  try {
    const res = await fetch('models.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`models.json ${res.status}`);
    const items = await res.json();
    if (!Array.isArray(items) || !items.length) throw new Error('비어 있음');

    for (const it of items) {
      const path = String(it.path || '').replace(/^\/+|\/+$/g, '');
      if (!path) continue;
      const a = document.createElement('a');
      a.className = 'card';
      a.href = `./${encodeURIComponent(path)}/`;
      const t = document.createElement('div');
      t.className = 't';
      t.textContent = it.title || path;
      a.appendChild(t);
      if (it.note) {
        const n = document.createElement('div');
        n.className = 'n';
        n.textContent = it.note;
        a.appendChild(n);
      }
      const p = document.createElement('div');
      p.className = 'p';
      p.textContent = `/${path}/`;
      a.appendChild(p);
      list.appendChild(a);
    }
    document.getElementById('foot').hidden = false;
    document.getElementById('foot').textContent =
      `${list.children.length}개`;
  } catch (e) {
    msg.hidden = false;
    msg.innerHTML =
      `<strong>목록을 불러오지 못했습니다.</strong> (${e.message})<br><br>` +
      `<code>models.json</code> 이 이 페이지와 같은 폴더에 있어야 합니다.<br>` +
      `파일을 직접 열면(<code>file://</code>) 브라우저가 막으니, ` +
      `<code>python3 -m http.server 8000</code> 으로 열어보세요.`;
  }
</script>
</body>
</html>
